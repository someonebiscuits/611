<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>611</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=VT323&display=swap">
<style id="lock">
html, body { margin: 0; height: 100%; background: #1a130c; color: #fff; font-family: 'Pixelify Sans', ui-monospace, monospace; -webkit-font-smoothing: antialiased; font-variant-ligatures: none; }
#lk { --u: min(1.6vh, 1.6vw, 8px); position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
#lk[hidden] { display: none; }
.gin { display: grid; gap: calc(var(--u) * 3); justify-items: center; width: min(100%, 420px); text-align: center; }
.gin h1 { margin: 0; font: 500 calc(var(--u) * 5.2 + 8px)/1.1 'Pixelify Sans', monospace; text-shadow: 2px 2px 0 #3f3f3f; }
.gin label { font: calc(var(--u) * 4 + 6px)/1.2 'VT323', monospace; color: #a0a0a0; }
.gbox { width: 100%; display: grid; gap: 8px; }
#pw { box-sizing: border-box; width: 100%; font: 26px/1 'VT323', monospace; color: #fff; background: #000; border: 2px solid #a0a0a0; padding: 10px 14px; outline: none; text-align: center; letter-spacing: .12em; }
#pw:focus { border-color: #fff; }
.ghint { font: 20px/1.2 'VT323', monospace; color: #ffff55; text-shadow: 2px 2px 0 #3f3f15; }
.gerr { font: 20px/1.2 'VT323', monospace; color: #ff6b6b; min-height: 1.2em; }
.go { width: 100%; font: 500 20px/1 'Pixelify Sans', monospace; color: #fff; text-shadow: 2px 2px 0 #3a3a3a; background: #6e6e6e; border: 2px solid #000; box-shadow: inset 2px 2px 0 #a8a8a8, inset -2px -3px 0 #393939; height: 48px; cursor: pointer; }
.go:hover { background: #7d86c4; border-color: #fff; color: #ffffa0; }
.go[disabled] { background: #2c2c2c; color: #7a7a7a; box-shadow: none; cursor: default; }
.shake { animation: sh .35s; } @keyframes sh { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
</style>
</head>
<body>
<form id="lk" autocomplete="off">
  <div class="gin" id="gin">
    <h1>Enter the passcode</h1>
    <div class="gbox"><label for="pw">Passcode</label><input id="pw" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go"></div>
    <div class="ghint">Hint: my password</div>
    <div class="gerr" id="err" aria-live="polite"></div>
    <button class="go" id="go" type="submit">Enter</button>
  </div>
</form>
<script>
(() => {
  const SALT = Uint8Array.from(atob('9ZEPrTs+W14ZU5pjsE1PlQ=='), c => c.charCodeAt(0)), ITER = 250000, MUSIC = true, TO = "cecilnagetdino@gmail.com", AKEY = "442aa326-9922-434c-90b1-2da99fea2805";
  const $ = s => document.querySelector(s), ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } } };
  const S = window.crypto && crypto.subtle;
  // sign-in alerts, like an app's: the page was opened, the passcode was right, the passcode was wrong.
  // Each says the kind of device and browser, and roughly where (a city from the connection, never GPS).
  window.SHELL_OPENED = true;   // the game leaves the "opened" mail to this page
  const WHO = !TO && !AKEY || /^(localhost|127\.0\.0\.1|\[::1\]|)$/.test(location.hostname) ? null : (async () => {
    const ua = navigator.userAgent, m = re => (ua.match(re) || [])[1] || '';
    const os = /iPhone|iPod/.test(ua) ? 'iPhone · iOS ' + m(/OS (\d+_\d+)/).replace('_', '.') : /iPad/.test(ua) || (/Mac OS X/.test(ua) && navigator.maxTouchPoints > 1) ? 'iPad' : /Android/.test(ua) ? 'Android ' + m(/Android ([\d.]+)/) : /Mac OS X/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : /Linux/.test(ua) ? 'Linux' : 'Unknown';
    let model = m(/Android [\d.]+; (?:[a-z]{2}[-_][a-z]{2}; )?([^;)]+?)(?: Build[^;)]*)?\)/i);
    try { if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) { const h = await navigator.userAgentData.getHighEntropyValues(['model']); if (h.model) model = h.model; } } catch (e) { }
    if (model === 'K') model = '';   // Chrome hides the model behind a "K"
    const browser = /Instagram/.test(ua) ? 'Instagram' : /\bLine\//.test(ua) ? 'LINE' : /WhatsApp/.test(ua) ? 'WhatsApp' : /CriOS/.test(ua) ? 'Chrome' : /FxiOS|Firefox/.test(ua) ? 'Firefox' : /EdgA?\/|EdgiOS/.test(ua) ? 'Edge' : /SamsungBrowser/.test(ua) ? 'Samsung Internet' : /Chrome/.test(ua) ? 'Chrome' : /Safari/.test(ua) ? 'Safari' : 'Browser';
    let near = 'Unknown';
    try {
      const ctl = new AbortController(); setTimeout(() => ctl.abort(), 5000);
      const g = await (await fetch('https://get.geojs.io/v1/ip/geo.json', { signal: ctl.signal })).json();
      near = [...new Set([g.city, g.region, g.country].filter(Boolean))].join(', ') + (g.organization_name ? ' (' + g.organization_name + ')' : '');
    } catch (e) { }
    const visit = ls.get('hw3:openMail') ? 'Opened before on this device' : 'First time on this device';
    ls.set('hw3:openMail', JSON.stringify(new Date().toDateString()));
    return { device: [os, model].filter(Boolean).join(' · '), browser, near, visit };
  })();
  // Web3Forms first; formsubmit.co only if that fails (it has gone down before).
  const post = (url, data) => fetch(url, { method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(data) })
    .then(r => r.json()).then(j => { if (!(j.success === true || j.success === 'true')) throw j; });
  const notify = (subject, extra) => { if (WHO) WHO.then(w => {
    const info = Object.assign({}, w, extra, { when: new Date().toString() });
    const fs = () => TO ? post('https://formsubmit.co/ajax/' + encodeURIComponent(TO), Object.assign({ _subject: subject, _template: 'box', _captcha: 'false' }, info)) : Promise.reject();
    return (AKEY ? post('https://api.web3forms.com/submit', Object.assign({ access_key: AKEY, subject, from_name: '611' }, info)).catch(fs) : fs());
  }).catch(() => {}); };
  notify('611 opened (passcode page)', {});
  let tries = 0;

  const bytes = async f => new Uint8Array(await (await fetch(f, { cache: 'no-cache' })).arrayBuffer());
  const open = async (key, data) => new Uint8Array(await S.decrypt({ name: 'AES-GCM', iv: data.slice(0, 12) }, key, data.slice(12)));
  const core = bytes('a.bin'), music = MUSIC ? bytes('b.bin') : null;
  core.catch(() => {}); if (music) music.catch(() => {});

  async function unlock(key) {
    const pack = JSON.parse(new TextDecoder().decode(await open(key, await core)));   // throws on a wrong key
    return { pack, key };
  }
  async function start({ pack, key }) {
    const url = (u, type) => URL.createObjectURL(new Blob([u], { type }));
    const photos = {}; for (const p in pack.photos) photos[p] = url(Uint8Array.from(atob(pack.photos[p]), c => c.charCodeAt(0)), 'image/jpeg');
    const song = music ? url(await open(key, await music), 'audio/mpeg') : null;
    ls.set('hw3:open', JSON.stringify('o3sfiq'));
    const st = document.createElement('style'); st.textContent = pack.css; document.head.appendChild(st); $('#lock').remove();
    $('#lk').remove(); document.body.insertAdjacentHTML('afterbegin', pack.body);
    for (const s of pack.scripts) {
      await new Promise((ok, no) => { const el = document.createElement('script'); el.src = s.src || url(s.code, 'text/javascript'); el.onload = ok; el.onerror = s.src ? ok : no; document.body.appendChild(el); });
      if (s.name === 'js/config.js' && window.BDAY) {
        (BDAY.album || []).forEach(a => { a.photos = (a.photos || []).map(p => photos[p] || p); });
        BDAY.music = song || '';
      }
    }
  }
  async function derive(pw) {
    const base = await S.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return S.deriveKey({ name: 'PBKDF2', salt: SALT, iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }
  const busy = on => { $('#go').disabled = on; $('#go').textContent = on ? 'Loading…' : 'Enter'; };

  // it asks every time: forget any key an older version of this page kept on the device
  try { localStorage.removeItem('hw3:k'); } catch (e) { }

  $('#lk').addEventListener('submit', async e => {
    e.preventDefault(); if ($('#go').disabled) return;
    if (!S) { $('#err').textContent = 'This browser cannot open it. Try Safari or Chrome.'; return; }
    busy(true); $('#err').textContent = '';
    let opened;
    try { const key = await derive($('#pw').value.trim().toLowerCase()); opened = await unlock(key); notify('611 · passcode entered', { attempts: String(tries + 1) }); }
    catch (err) { if (++tries <= 3) notify('611 · wrong passcode', { attempt: String(tries) }); busy(false); $('#err').textContent = "That's not it."; const g = $('#gin'); g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake'); $('#pw').select(); return; }
    try { await start(opened); } catch (err) { busy(false); $('#err').textContent = 'It could not load. Check the connection and try again.'; }
  });
  setTimeout(() => { try { if (!$('#lk').hidden) $('#pw').focus(); } catch (e) { } }, 300);
})();
</script>
</body>
</html>
